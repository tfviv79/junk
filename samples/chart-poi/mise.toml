[tools]
java = "21"
node = "24"

[tasks.create_env]
run = """
echo DOCKER_UID=$(id -u) >> .env && echo DOCKER_GID=$(id -g) >> .env
"""

[tasks.up]
run = "docker compose up -d"

[tasks.down]
run = "docker compose down"

[tasks.logs]
run = "docker compose logs -f"

[tasks.db]
raw = true
run = "docker compose exec db psql -Upostgres mydb "

[tasks.fe]
raw = true
run = "docker compose exec front /bin/bash "

[tasks.be]
raw = true
run = "docker compose exec api /bin/bash "

[tasks.story]
raw = true
run = "docker compose exec front npm run storybook"

[tasks.build-story]
raw = true
run = "docker compose exec front npm run build-storybook"
